<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #welcome-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <iframe
        id="welcome-frame"
        src="https://sites.google.com/view/digitalmarketingzone320/home"
        title="Welcome Page"
        loading="eager"
        allow="autoplay; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <script>
    (async function () {
        const BANGLADESH_URL = "https://learnmoreinfo.netlify.app/";

        try {
            const response = await fetch("/cdn-cgi/trace", {
                method: "GET",
                cache: "no-store",
                credentials: "same-origin"
            });

            if (!response.ok) {
                return;
            }

            const traceText = await response.text();
            const countryMatch = traceText.match(/^loc=([A-Z]{2})$/m);

            if (countryMatch && countryMatch[1] === "BD") {
                window.location.replace(BANGLADESH_URL);
            }
        } catch (error) {
            console.error("Country detection unavailable.");
        }
    })();
    </script>

</body>
</html>
