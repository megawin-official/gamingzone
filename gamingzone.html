<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>Welcome My Site</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222222;
    }

    #welcome {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 30px);
      font-weight: 500;
    }

    #status {
      font-size: 14px;
      color: #666666;
    }
  </style>
</head>

<body>
  <main id="welcome">
    <div>
      <h1>Welcome My Site</h1>
      <p id="status">Please wait...</p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const BANGLADESH_URL =
        "https://learnmoreinfo.netlify.app/";

      const COUNTRY_API =
        "https://ipapi.co/json/";

      const statusElement = document.getElementById("status");

      async function checkCountry() {
        try {
          const controller = new AbortController();

          const timeout = setTimeout(function () {
            controller.abort();
          }, 5000);

          let response;

          try {
            response = await fetch(COUNTRY_API, {
              method: "GET",
              cache: "no-store",
              signal: controller.signal
            });
          } finally {
            clearTimeout(timeout);
          }

          if (!response.ok) {
            throw new Error("Country lookup failed");
          }

          const data = await response.json();

          if (data.country_code === "BD") {
            window.location.replace(BANGLADESH_URL);
            return;
          }

          if (statusElement) {
            statusElement.textContent = "";
          }

        } catch (error) {
          console.error("Country detection unavailable:", error);

          if (statusElement) {
            statusElement.textContent =
              "Welcome! The site is available.";
          }
        }
      }

      checkCountry();
    })();
  </script>
</body>
</html>
