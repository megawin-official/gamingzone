```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome My Site</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222222;
    }

    #welcome {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main id="welcome">
    <h1>Welcome My Site</h1>
  </main>

  <script>
    (async function () {
      const BANGLADESH_URL = "https://learnmoreinfo.netlify.app/";

      try {
        const response = await fetch("https://ipapi.co/json/", {
          cache: "no-store"
        });

        if (!response.ok) return;

        const data = await response.json();

        if (data.country_code === "BD") {
          window.location.replace(BANGLADESH_URL);
        }
      } catch (error) {
        console.error("Country lookup unavailable.");
      }
    })();
  </script>
</body>
</html>
